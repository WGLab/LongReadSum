{% set version = environ.get('GIT_DESCRIBE_TAG', '1.5.0').lstrip('v') %}
{% set revision = environ.get('GIT_FULL_HASH', '11961b2cc93534057df2bd668c2277267222916b') %}

package:
  name: longreadsum
  version: {{ version }}

source:
  path: ../
  git_lfs: false
  # git_url: https://github.com/WGLab/LongReadSum.git
  # git_rev: {{ revision }}

channels:
  - conda-forge
  - jannessp  # for pod5
  - bioconda
  - defaults

build:
  number: 0
  skip: true  # [py2k]
  entry_points:
    - longreadsum = entry_point:main

requirements:
  build:
    - {{ compiler('cxx') }}
    - make
  host:
    - python=3.9
    - swig
    - htslib=1.20
    - ont_vbz_hdf_plugin  # Contains HDF5 as a dependency as well
  run:
    - python=3.9
    - numpy
    - ont_vbz_hdf_plugin
    - bioconda::htslib=1.20
    - plotly
    - jannessp::pod5
    - pyarrow

test:
    commands:
        - longreadsum --help
about:
  home: https://github.com/WGLab/LongReadSum
  license: MIT
  summary: 'Long read sequencing quality control tool'
  description: |
    A fast and flexible QC tool for long read sequencing data.
  dev_url: https://github.com/WGLab/LongReadSum
  doc_url: https://github.com/WGLab/LongReadSum#readme
